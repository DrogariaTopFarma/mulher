<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D66C86">
  <title>Rota Segura — Mapa colaborativo de segurança para mulheres</title>
  <meta name="description" content="Site colaborativo onde mulheres consultam e registram informações sobre a segurança de ruas, pontos de ônibus, estações e estabelecimentos da cidade.">
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
  <a href="#cardsSection" class="skip-link">Pular para os locais mapeados</a>
 
  <!-- ===================== CABEÇALHO ===================== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Rota Segura</p>
          <p class="brand-tagline">Mapeado por quem caminha a cidade todos os dias</p>
        </div>
      </div>
 
      <form class="search-form" role="search" id="searchForm">
        <label for="searchInput" class="visually-hidden">Buscar por local, bairro ou palavra-chave</label>
        <input type="search" id="searchInput" placeholder="Buscar por local, bairro ou palavra-chave...">
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>
    </div>
  </header>
 
  <!-- ===================== ABAS DE CATEGORIA ===================== -->
  <nav class="tabs" aria-label="Filtrar por categoria">
    <div class="tabs-inner">
      <button class="tab-btn active" data-category="todos" type="button">Todos os Locais</button>
      <button class="tab-btn" data-category="rua" type="button">Ruas &amp; Praças</button>
      <button class="tab-btn" data-category="estabelecimento" type="button">Estabelecimentos</button>
      <button class="tab-btn" data-category="onibus" type="button">Pontos de Ônibus</button>
      <button class="tab-btn" data-category="estacao" type="button">Estações</button>
    </div>
  </nav>
 
  <main>
    <!-- ===================== CARDS ===================== -->
    <section id="cardsSection" class="cards-section">
      <div class="section-heading">
        <h2>Locais mapeados pela comunidade</h2>
        <p id="resultsCount" class="results-count">carregando...</p>
      </div>
      <div id="cardsGrid" class="cards-grid" aria-live="polite">
        <!-- cards inseridos via JavaScript -->
      </div>
    </section>
 
    <!-- ===================== CADASTRO RÁPIDO ===================== -->
    <section id="cadastroSection" class="cadastro-section">
      <div class="cadastro-inner">
        <h2>Conhece um lugar? Registre aqui</h2>
        <p class="cadastro-sub">Leva menos de um minuto e ajuda outras mulheres a se planejarem. Não é preciso criar conta.</p>
 
        <form id="cadastroForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="inputNome">Nome do local ou endereço</label>
              <input type="text" id="inputNome" name="nome" placeholder="Ex: Praça da Matriz, Rua das Palmeiras nº 45..." required>
            </div>
            <div class="field">
              <label for="inputBairro">Bairro</label>
              <input type="text" id="inputBairro" name="bairro" placeholder="Ex: Centro" required>
            </div>
          </div>
 
          <div class="field">
            <label for="inputCategoria">Categoria</label>
            <select id="inputCategoria" name="categoria" required>
              <option value="" disabled selected>Selecione uma categoria</option>
              <option value="rua">Rua</option>
              <option value="onibus">Ponto de Ônibus</option>
              <option value="estacao">Estação</option>
              <option value="estabelecimento">Estabelecimento</option>
            </select>
          </div>
 
          <fieldset class="field">
            <legend>Nível de atenção</legend>
            <div class="level-options">
              <input type="radio" id="levelSeguro" name="nivel" value="seguro" required>
              <label for="levelSeguro" class="level-chip level-chip--seguro"><span class="lamp" aria-hidden="true"></span>Seguro</label>
 
              <input type="radio" id="levelAtencao" name="nivel" value="atencao">
              <label for="levelAtencao" class="level-chip level-chip--atencao"><span class="lamp" aria-hidden="true"></span>Pouco iluminado</label>
 
              <input type="radio" id="levelAlerta" name="nivel" value="alerta">
              <label for="levelAlerta" class="level-chip level-chip--alerta"><span class="lamp" aria-hidden="true"></span>Isolado / Alerta</label>
            </div>
          </fieldset>
 
          <div class="field">
            <label for="inputFoto">Foto do local (opcional)</label>
            <input type="file" id="inputFoto" name="foto" accept="image/*">
            <img id="fotoPreview" class="foto-preview" alt="Pré-visualização da foto enviada" hidden>
          </div>
 
          <div class="field">
            <label for="inputDescricao">Descrição ou relato</label>
            <textarea id="inputDescricao" name="descricao" rows="3" placeholder="Ex: Rua bem movimentada durante o dia, mas com pouca luz à noite..."></textarea>
          </div>
 
          <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
 
          <button type="submit" class="btn-submit">Cadastrar Local</button>
        </form>
      </div>
    </section>
  </main>
 
  <!-- ===================== NAVEGAÇÃO INFERIOR ===================== -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button id="navHome" class="bottom-nav-item active" type="button">
      <span aria-hidden="true">🏠</span>
      <span>Início</span>
    </button>
    <button id="navRoute" class="bottom-nav-item" type="button">
      <span class="nav-icon-wrap" aria-hidden="true">💗<span id="savedCount" class="saved-badge" hidden>0</span></span>
      <span>Minha Rota</span>
    </button>
    <button id="navCadastrar" class="bottom-nav-item" type="button">
      <span aria-hidden="true">📍</span>
      <span>Cadastrar</span>
    </button>
  </nav>
 
  <script src="js/script.js"></script>
</body>
</html>
